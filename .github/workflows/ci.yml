name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    # Runs the full pipeline (ingest -> dbt build + tests -> model -> export ->
    # static site) on the synthetic fixture, so every model and test is
    # exercised without the 30 GB Kaggle download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make fixture
      - name: Build site from the committed KKBox aggregates
        run: make site
